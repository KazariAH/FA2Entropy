; =============================================================================
; FA2Entropy.dll behaviour configuration
;
; Compiled into the DLL and read from there at run time; this file is never
; created on disk. Edit it, then rebuild the project.
;
; Format: section and key names are case-insensitive, a key may appear several
; times to provide several values, and ';' starts a comment.
; =============================================================================

[Host]
; Only work inside the process with this name (the map editor itself).
; Every other process (for example the Syringe loader) is left untouched.
Exe=FA2Entropy.dat
; PE time stamp of the host (hexadecimal). A mismatch only adds a log note.
TimeStamp=0x3EDB6BD4

[Paths]
; Every ini (plus the data files listed in [DataFiles]) is moved into this
; sub-folder, and all later reads and writes of <editor dir>\xxx.ini are
; redirected to DataMain\xxx.ini. Leave empty to disable both.
DataDir=DataMain
; Previous name of that sub-folder; if it exists, its contents are merged in.
LegacyDataDir=INIMain

[DataFiles]
; Extra data files to move into DataDir\ (opens of the same name are redirected).
; The [ExtraMixes] entry in assets\Quantum01.ini must use the same relative path.
Move=Quantum.rpck

[Others]
; Stray or unneeded files: moved here at start-up and redirected on open, so
; they neither show up in the root folder nor take part in the editor run.
; Leave the list empty unless a leftover file has to be parked.
; Never list files the editor needs (fa2extra.mix and fa2palegrid.mix are loaded
; by FA2sp) and never list the log files (they are meant to be read).
Dir=Others
; The original launcher, superseded by FA2Entropy.exe.
Move=FA2SPLaunch.exe
;Move=some-old-file.ini

[Log]
; 1 = write FA2Entropy.log next to the DLL and echo the same lines to the debugger.
; 0 = no log output at all (release setting).
Enabled=0

[Shadow]
; Shadow copy location: %LOCALAPPDATA%\<Dir>\<File>
; The shadow copy stands in for the editor's FinalAlert.ini and takes its
; contents from assets\FinalAlert.ini.
Dir=FA2Entropy
File=fa2entropy.dat

[Lock]
; The ini we fix. It stays a normal file next to the editor, so the editor and FA2sp
; read and write their option settings there as usual and those settings keep working.
; The keys that assets\FinalAlert.ini defines (language, resource paths ...) are forced
; into that file again on every start and writes to them are dropped, so they cannot be
; changed from inside the editor.
Ini=FinalAlert.ini
; Everything else the editor keeps in that ini - preferences, recent files, tip
; state - is stored in this ini instead, in the editor directory. Those settings
; therefore still work and keep their values across runs, while the fixed keys
; above stay fixed. The file is never moved into DataDir\ and never redirected.
UserIni=FA2Entropy.ini

[Include]
; Keep this entry at the end of the include list (later entries win).
; Format: target-ini=entry. The name on the right must match [Extract].
Fix=FAData.ini=qec01.dat
Fix=FALanguage.ini=qec02.dat

; Remove the entry from the include list so its data never reaches the editor.
; A zero-byte copy is provided as well, for any other code path that opens it.
Drop=FAData_TriggerAndScript.ini
Drop=Quantum01.ini
Drop=Quantum02.ini

[Extract]
; Release the embedded QEC inis into the shadow folder under these names
; (the editor opens them through the Fix= entries above).
;   101 = assets\Quantum01.ini (config)   102 = assets\Quantum02.ini (language)
101=qec01.dat
102=qec02.dat

[Search]
; Add this sub-folder of the editor directory to the Windows DLL search path
; (folder name only, empty = do not add). It keeps the support libraries
; (lua.dll, libcrypto_1_1.dll, libssl-1_1.dll, Lexilla.dll, Scintilla.dll,
; CncVxlRenderText.dll) out of the root folder.
; The movable *.dll files are moved here at start-up as well.
DllDir=DllMain

[Move]
; Whitelist of the DLL move: names listed here are never moved.
; Never moved automatically: FA2Entropy.dll itself, any DLL with a .syhks00
; section (injected by Syringe, e.g. FA2Sp.dll) and any DLL imported by the
; editor itself (e.g. ddraw.dll). Files in use are left for the next start-up.
Keep=FA2sp.dll
Keep=FA2Entropy.dll
Keep=ddraw.dll

[Delete]
; Files listed here are moved into Others\ (same behaviour as [Others]).
; Wildcards * and ? are allowed; only the editor folder itself is scanned and
; file names only. A wildcard entry skips exe/dll/dat/mix/log files - name such
; a file exactly to move it.
;File=Quantum01.ini
;File=Quantum02.ini
;File=FAData_TriggerAndScript.ini
File=presets_des.map
File=presets_sno.map
File=presets_tem.map
File=presets_ubn.map
File=presets_urb.map
File=presets_lun.map
; FinalAlert.ini is NOT listed here: it is the editor's own config and has to stay in
; the editor directory so option settings can be stored and read back normally

[Menu]
; Menu items to remove: by command ID first, then by exact text as a fallback
; (exact match, so "Paste Options" is never touched).
KillId=40004
KillWord=设置
; Windows with these titles are closed automatically (the Options dialog).
KillDialog=选项
KillDialog=Options
; 1 = also remove the whole top-level Options menu.
KillTopLevelOptions=0
; Watchdog re-check interval in milliseconds.
WatchInterval=700
