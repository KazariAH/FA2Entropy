; =============================================================================
; FA2Entropy - example of a FAData.ini adaptation
;
; This file stands in for the editor's FAData.ini:
;   * the build packs it into the DLL under the name given in [Extract] (qec01.dat)
;   * the [Include] Fix= entry in assets\FA2Entropy.ini makes the editor load that
;     file in place of FAData.ini, so a shipped editor needs no such file on disk
;
; Only examples are listed here. Put your own data in this file: keys that are also
; defined by the editor's own FAData.ini win, because this file is loaded last.
; =============================================================================

[ExtConfigs]
; Example switches
AllowIncludes=false
SortByTriggerName=true
AdjustDropdownWidth=true

[ExtraMixes]
; filename=yes means: look for it in the editor folder, not in the game folder
example.mix=yes

[Filenames]
; Example: which files the editor reads for the mod
RulesYR=example-rules.ini
ArtYR=example-art.ini
