; =============================================================================
; FA2Entropy - example of a FALanguage.ini adaptation
;
; This file stands in for the editor's FALanguage.ini:
;   * the build packs it into the DLL under the name given in [Extract] (qec02.dat)
;   * the [Include] Fix= entry in assets\FA2Entropy.ini makes the editor load that
;     file in place of FALanguage.ini, so a shipped editor needs no such file on disk
;
; Only examples are listed here. Replace them with your own text; the section name is
; <LANGUAGE>-Strings, <LANGUAGE>-Translations, <LANGUAGE>-StringsRA2 or
; <LANGUAGE>-TranslationsRA2, where LANGUAGE is the language set in assets\FinalAlert.ini.
; =============================================================================

[Chinese-Strings]
; Example entries
TileSet0000=Example ground
TileSet0009=Example slope

[Chinese-Translations]
; Example entries
Menu.File=File
Menu.File.Open=Open
