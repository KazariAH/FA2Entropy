; =============================================================================
; FA2Entropy - example of the editor configuration
;
; The build packs this file into the DLL and the editor is served these values on
; every start, so a shipped editor needs no such file on disk. The keys listed here
; are the fixed ones: the editor cannot change them, and writes to them are dropped.
;
; Replace the examples with your own values.
;
;   Language / LanguageSP : interface language (Chinese / English / ...)
;   FileSearchLikeTS      : search files the TS way (used when the mod's files are
;                           packed into a mix archive)
;   [TS] Exe              : game resource path, relative to the editor folder
;
; ';' starts a comment. ANSI and UTF-8 are both accepted.
; =============================================================================

[FinalSun]
Language=Chinese
LanguageSP=Chinese
FileSearchLikeTS=yes

[TS]
Exe=..\ExampleMod\ExampleMod.mix
